[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simtelem"
version = "0.1.0"
description = "Uniform telemetry capture and storage for sim racing (ACC, Assetto Corsa, F1)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Fidelis Mwansa" }]
keywords = [
    "sim-racing", "telemetry", "assetto-corsa-competizione", "acc",
    "motorsport", "shared-memory", "data-acquisition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# ACC shared memory is Windows-only; keep it out of the base install so the
# package stays importable on Linux CI and on analysis boxes.
acc = ["pyaccsharedmemory>=0.3"]
tabular = ["pandas>=1.5", "pyarrow>=10"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = ["simtelem[acc,tabular]"]

[project.scripts]
simtelem = "simtelem.cli:main"

[project.urls]
Homepage = "https://github.com/kuroazai/simtelem"
Issues = "https://github.com/kuroazai/simtelem/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/simtelem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
packages = ["simtelem"]
ignore_missing_imports = true
warn_unused_ignores = true
