name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No [acc] extra: ACC shared memory is Windows-only. The mock and replay
        # sources are what make the package testable on Linux at all.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tabular,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov=simtelem --cov-report=term-missing
